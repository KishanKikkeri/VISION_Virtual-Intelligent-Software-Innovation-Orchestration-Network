[pytest]
# Many tests (e.g. tests/foundation/test_m32_repository.py) are bare
# `async def test_...` with no @pytest.mark.asyncio. Without auto mode,
# pytest-asyncio's default "strict" mode rejects them with
# "async def functions are not natively supported".
asyncio_mode = auto
testpaths = tests
# e2e tests need the Docker stack (postgres, nats, qdrant, services on :8000/:8001)
# and cannot run on a bare CI runner. Run them locally with:  pytest -m e2e
addopts = -m "not e2e"
