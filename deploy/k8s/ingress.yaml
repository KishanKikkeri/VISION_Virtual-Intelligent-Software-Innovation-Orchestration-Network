# deploy/k8s/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aasc-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aasc.example.com
      secretName: aasc-platform-tls
  rules:
    - host: aasc.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aasc-platform
                port:
                  number: 80
