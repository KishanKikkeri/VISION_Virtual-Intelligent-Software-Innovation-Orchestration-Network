# deploy/k8s/networkpolicy.yaml
# ================================
# Default-deny plus explicit allows: ingress only from the ingress
# controller namespace, egress only to the database/cache/messaging
# ports and DNS. Tightens the blast radius if the API pod is ever
# compromised.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aasc-platform
spec:
  podSelector:
    matchLabels:
      app: aasc-platform
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 5432  # postgres
        - protocol: TCP
          port: 6379  # redis
        - protocol: TCP
          port: 4222  # nats
