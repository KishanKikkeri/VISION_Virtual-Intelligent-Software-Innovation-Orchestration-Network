# deploy/k8s/rbac.yaml
# ======================
# Least-privilege RBAC: the application only ever reads its own
# ConfigMap/Secret and (optionally) lists Pods for the "Deployment
# Health" dashboard widget — it never has cluster-admin, never creates/
# deletes other workloads.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aasc-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aasc-platform
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aasc-platform
subjects:
  - kind: ServiceAccount
    name: aasc-platform
roleRef:
  kind: Role
  name: aasc-platform
  apiGroup: rbac.authorization.k8s.io
