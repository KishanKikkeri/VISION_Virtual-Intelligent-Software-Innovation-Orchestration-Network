# deploy/docker/docker-compose.staging.yml
# =========================================
# M4.9 §12 Deployment Assets — staging Compose file. Template only —
# no real secrets. Pairs with `deploy.profile=staging` (TLS required,
# moderate resource limits, structured logging).

version: "3.9"

services:
  api:
    image: ${AASC_IMAGE:-aasc-platform}:${AASC_VERSION:?AASC_VERSION is required}
    environment:
      AASC_ENVIRONMENT: staging
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      NATS_URL: ${NATS_URL:?NATS_URL is required}
      LOG_LEVEL: INFO
      TLS_CERT_PATH: /etc/aasc/tls/tls.crt
      TLS_KEY_PATH: /etc/aasc/tls/tls.key
    ports:
      - "8443:8443"
    volumes:
      - aasc_tls_staging:/etc/aasc/tls:ro
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.5"
          memory: 512m
      restart_policy:
        condition: on-failure
        max_attempts: 5

volumes:
  aasc_tls_staging:
    external: true
